<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  GlyphT application icon. It matches icon.icns (macOS): a dark rounded square
  with a terminal window, in the Catppuccin Mocha colours. The background is
  transparent outside of the rounded square.

  This is the only SVG of the icon, for all platforms.
  icon.icns is made from this file by make_icns.sh, glypht.ico by make_ico.ps1.
-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.1"
   width="1024"
   height="1024"
   viewBox="0 0 1024 1024">
  <!-- icon base -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="#1e1e2e" />

  <!-- terminal window: body, then the title bar on top -->
  <path
     d="M 96,840 V 184 A 24,24 0 0 1 120,160 H 904 A 24,24 0 0 1 928,184 V 840 A 24,24 0 0 1 904,864 H 120 A 24,24 0 0 1 96,840 Z"
     fill="#181825" />
  <path
     d="M 96,240 V 184 A 24,24 0 0 1 120,160 H 904 A 24,24 0 0 1 928,184 V 240 Z"
     fill="#313244" />

  <!-- window buttons -->
  <circle cx="176" cy="201" r="16" fill="#ff5f57" />
  <circle cx="232" cy="201" r="16" fill="#ffbd2e" />
  <circle cx="288" cy="201" r="16" fill="#28ca41" />

  <!-- terminal text -->
  <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
    <text x="154.5" y="344.5" font-size="52" fill="#a6e3a1">$</text>
    <text x="202" y="341" font-size="52" font-weight="bold" letter-spacing="4.9" fill="#cdd6f4">./wxterminal</text>
    <text x="150" y="428" font-size="46" letter-spacing="3.6" fill="#89b4fa">wxTerminalEmulator v1.0</text>
    <text x="152" y="504" font-size="46" letter-spacing="3.6" fill="#6c7086">Starting shell...</text>
    <text x="154.5" y="620.5" font-size="52" fill="#a6e3a1">$</text>
  </g>

  <!-- cursor -->
  <rect x="204" y="570" width="32" height="60" rx="4" ry="4" fill="#f5c2e7" />
</svg>
