name: macos

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/macos.yml'
      - '!**.md'
  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/macos.yml'
      - '!**.md'

jobs:
  macos:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        wx-version: ['v3.2.8.1']

    steps:
    - name: Checkout wxTerminalEmulator
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: cmake --version
      run: cmake --version

    - name: Build
      env:
        WX_VERSION: ${{ matrix.wx-version }}
      run: ./build.sh
