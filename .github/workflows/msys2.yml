name: msys2

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/msys2.yml'
  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/msys2.yml'

jobs:
  msys2:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        wx-version: ['v3.3.4']

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: clang64
        update: true
        install: >-
          git
          make
          mingw-w64-clang-x86_64-cmake
          mingw-w64-clang-x86_64-make
          mingw-w64-clang-x86_64-clang
          mingw-w64-clang-x86_64-clang-tools-extra
          mingw-w64-clang-x86_64-glew

    - name: Checkout wxTerminalEmulator
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # build.sh builds wxWidgets once and reuses it when it finds the install.
    - name: Cache wxWidgets
      uses: actions/cache@v6
      with:
        path: .build-release/wxWidgets-install
        key: wxwidgets-${{ runner.os }}-${{ matrix.wx-version }}-${{ hashFiles('build.sh', 'patches/**') }}

    - name: Build
      shell: msys2 {0}
      env:
        WX_VERSION: ${{ matrix.wx-version }}
      run: ./build.sh
